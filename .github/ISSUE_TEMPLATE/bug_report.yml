name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Thread mode
      options: [Auto mode, Accept edits, Ask me, Not applicable]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Node.js version
      placeholder: Windows 11, Node 24.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Daemon output or screenshots
      description: Remove any tokens before pasting.
