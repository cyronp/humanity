<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#fafafa" />
    <title>Humanity</title>
    <!--
      Until the app renders: the brand mark, centered on the sidebar's colour.
      The app's loading state looks the same, so nothing moves when it takes over.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      #boot img {
        width: 96px;
        height: 96px;
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          background: #0a0a0a;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><img src="/favicon.svg" alt="" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
