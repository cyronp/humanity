appId: dev.humanity.desktop
productName: Humanity
directories:
  output: release
icon: build/icon.png
# The main process is one bundled file: nothing from node_modules goes into the app.
files:
  - dist/main.cjs
  - package.json
# The daemon runs as a child process with the Agent SDK and node-pty (the
# terminals' native module, Node-API, its Windows binaries only) beside it,
# which need real paths on disk: they ship next to the archive, not inside it.
# No agent ships: threads run on the CLIs the human installed.
extraResources:
  - from: dist/daemon
    to: daemon
  # electron-builder skips any node_modules folder it meets inside a resource,
  # so the daemon's own is named as a resource itself.
  - from: dist/daemon/node_modules
    to: daemon/node_modules
npmRebuild: false
win:
  target: nsis
nsis:
  # No spaces: GitHub turns them into dots when the installer is attached to a release.
  artifactName: ${productName}-Setup-${version}.${ext}
# Writes latest.yml beside the installer and app-update.yml into the app, which
# electron-updater reads. Nothing is uploaded from here: the release workflows
# attach the files, and the app picks the stable or nightly folder at runtime.
# The file is latest.yml for a nightly too: without this, a version such as
# 0.1.0-nightly.20261115 would name it nightly.yml, which the app never asks for.
detectUpdateChannel: false
publish:
  provider: generic
  url: https://github.com/cyronp/humanity/releases/latest/download
